      #root {
        min-height: 100vh;

        display: flex;

      }
      /* Shimmer Animation */
      @keyframes skeletonShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .sk-shimmer {
        background: linear-gradient(90deg, #f4f4f5 25%, #e4e4e7 50%, #f4f4f5 75%);
        background-size: 200% 100%;
        animation: skeletonShimmer 1.5s infinite ease-in-out;

      .skeleton-shell {
        display: flex;
        flex-direction: column;
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px 16px;
        gap: 18px;
      }
      .sk-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 0 6px;
      }
      .sk-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      .sk-title {
        width: 140px;
        height: 24px;
        border-radius: 6px;
      }
      .sk-subtitle {
        width: 220px;
        height: 14px;
        border-radius: 4px;
      }
      .sk-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        background: #e4e4e7;
        padding: 4px;
        border-radius: 12px;
      }
      .sk-tab {
        height: 40px;
        border-radius: 8px;
      }
      .sk-card {
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .sk-viewport {
        width: 100%;
        aspect-ratio: 1;
        max-width: 280px;
        border-radius: 12px;
      }
      .sk-btn {
        width: 100%;
        height: 44px;
        border-radius: 10px;
      }
